# Run the test suite on the release runners without building or publishing.
#
# Started by hand (Actions -> Test Art Kit -> Run workflow). It exists because
# the Mac runners are the only place the kit's Tk code meets Aqua, and the
# release workflow is the wrong place to find that out: v2.8.0's first Mac
# builds stopped at their tests, and the only way to try a fix was to publish
# again. `-X faulthandler` prints the Python stack if Tk crashes the process
# outright, which it can do on a Mac rather than raise.
name: Test Art Kit

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Only tests matching this -k pattern (empty: all)'
        required: false
        default: ''

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the art kit
        uses: actions/checkout@v4
        with:
          path: ArtKit

      # The same two paths of the game the release workflow takes; see there.
      - name: Check out the game (for gen_objects.py)
        uses: actions/checkout@v4
        with:
          repository: hero-999-dev/pixel_pomo
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: App
          sparse-checkout: |
            flutter/tools
            flutter/assets/objects
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip Pillow

      - name: Versions
        shell: bash
        run: |
          python -c "import sys, platform, tkinter; r = tkinter.Tk(); print(sys.version); print(platform.platform(), platform.mac_ver()[0]); print('Tk', r.tk.call('info', 'patchlevel'), r.tk.call('tk', 'windowingsystem')); r.destroy()"

      - name: Tests
        working-directory: ArtKit
        shell: bash
        env:
          PATTERN: ${{ github.event.inputs.pattern }}
        run: |
          if [ -n "$PATTERN" ]; then
            python -X faulthandler -m unittest discover -s tests -v -k "$PATTERN"
          else
            python -X faulthandler -m unittest discover -s tests -v
          fi

      # A segfault inside Tk leaves no Python traceback past the call into
      # Tk; macOS's own crash report has the native frames.
      - name: Crash report (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os, time
          folder = os.path.expanduser("~/Library/Logs/DiagnosticReports")
          for _ in range(30):
              files = sorted(glob.glob(os.path.join(folder, "*.ips")), key=os.path.getmtime)
              if files:
                  break
              time.sleep(2)
          print("
".join(sorted(os.listdir(folder))) if os.path.isdir(folder) else "no folder")
          if files:
              path = files[-1]
              print("==", path)
              header, _, body = open(path, encoding="utf-8").read().partition("
")
              report = json.loads(body)
              print(report.get("exception"), report.get("termination"))
              print(report.get("asi"))
              images = report.get("usedImages", [])
              for n, thread in enumerate(report.get("threads", [])):
                  if not (thread.get("triggered") or n == report.get("faultingThread")):
                      continue
                  for frame in thread.get("frames", [])[:60]:
                      i = frame.get("imageIndex")
                      name = images[i].get("name", "?") if i is not None and i < len(images) else "?"
                      print(f"{name:32} {frame.get('symbol', hex(frame.get('imageOffset', 0)))}"
                            f" +{frame.get('symbolLocation', 0)}")
          PY
