# Build the Art Kit for Windows AND macOS, and publish both to one release.
#
# macOS is the whole reason this exists: PyInstaller cannot cross-compile, so a
# Mac build can only be produced on a Mac runner. Windows is built here too so
# both binaries in a release come from the same commit and the same process,
# rather than one from CI and one from whichever machine was handy.
#
# NOTE: this workflow checks out a SECOND, private repository — the game, for
# `flutter/tools/gen_objects.py`, which the spec bundles into the binary so the
# packaged kit works with no game checkout. The built-in GITHUB_TOKEN cannot
# read another private repo, so it needs a PAT in the secret APP_REPO_TOKEN
# (fine-grained, read-only Contents on hero-999-dev/pixel_pomo).
name: Release Art Kit

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.1.0)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PixelPomoArtKit-windows
          # TWO Mac builds, not one. PyInstaller cannot cross-compile between
          # architectures any more than it can between operating systems, so an
          # Intel Mac needs a binary produced on an Intel runner. macos-latest
          # is Apple Silicon (the runner image is macos-26-arm64), which is why
          # the first Mac release would not have opened on an Intel machine at
          # all — and the artist has no way to tell from the filename, hence the
          # explicit names.
          - os: macos-latest
            artifact: PixelPomoArtKit-macos-apple-silicon
          - os: macos-15-intel
            artifact: PixelPomoArtKit-macos-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # each job publishes its own binary to the release
    steps:
      # The spec resolves gen_objects.py RELATIVE to itself (ArtKit/ -> ../App),
      # so the two checkouts have to land as siblings under one parent.
      - name: Check out the art kit
        uses: actions/checkout@v4
        with:
          path: ArtKit

      # SPARSE, and not just to save time. A full checkout fails outright on
      # Windows: the game repo carries feedback screenshots whose names are the
      # feedback itself ("2 ve 3 numarali cicekler cok güzel en soldaki
      # olmamis..."), which blows past the 260-character path limit and aborts
      # the clone with "Filename too long". The build needs exactly two paths
      # out of that repo, so it asks for exactly two.
      - name: Check out the game (for gen_objects.py)
        uses: actions/checkout@v4
        with:
          repository: hero-999-dev/pixel_pomo
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: App
          sparse-checkout: |
            flutter/tools
            flutter/assets/objects
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip pyinstaller Pillow

      # The gate: the kit renders through the game's own compositing code, so a
      # generator change that breaks it must stop the release, not ship in it.
      # -X faulthandler: on a Mac, Tk can crash the process outright rather
      # than raise, and this prints where (v2.8.0's first Mac builds).
      - name: Tests
        working-directory: ArtKit
        run: python -X faulthandler -m unittest discover -s tests

      - name: Build
        working-directory: ArtKit
        run: python -m PyInstaller PixelPomoArtKit.spec --noconfirm --clean

      # Zip on the runner rather than letting upload-artifact do it, so the
      # release asset is one file the artist can double-click, and so the macOS
      # .app keeps its bundle structure and executable bit (a plain upload of a
      # .app directory loses both).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: ArtKit
        run: |
          mkdir stage
          copy dist\PixelPomoArtKit.exe stage\
          copy READ-ME-FIRST.txt stage\
          copy assets\icon.png stage\
          powershell Compress-Archive -Path stage\* -DestinationPath ${{ matrix.artifact }}.zip -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: ArtKit
        run: |
          mkdir stage
          cp -R dist/PixelPomoArtKit.app stage/
          # the Mac-specific guide, not the Windows one — Gatekeeper, the
          # Applications-folder step and the Documents/ library path are all
          # different here, and getting any of them wrong is a dead end for the
          # artist rather than a small annoyance
          cp READ-ME-FIRST-MAC.txt stage/
          cp assets/icon.png stage/
          cd stage && zip -qry ../${{ matrix.artifact }}.zip .

      # Straight to the release, NOT via upload-artifact (#v2.1.0). Both builds
      # succeeded on the first real run and then died on the upload step with
      # "Artifact storage quota has been hit" — the account's artifact storage
      # is shared with the game repo, which publishes an APK on every push.
      # Release assets are separate storage and do not count against it, so
      # skipping the artifact round-trip removes a whole class of failure
      # rather than waiting 6-12 hours for a quota recalculation.
      #
      # Both platform jobs race to create the tag; whichever loses just uploads
      # into the release the other made.
      - name: Publish to the release
        shell: bash
        working-directory: ArtKit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Pixel Pomo Art Kit $TAG" --generate-notes \
            || echo "release already exists — uploading into it"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ matrix.artifact }}.zip"
